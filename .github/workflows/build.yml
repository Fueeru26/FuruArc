name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11
          cache: gradle
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
      # gradle.properties keeps the small phone settings for AndroidIDE (-Xmx2048m, C1 JIT only). The Kotlin compiler runs
      # inside the Gradle daemon, and the app has grown past that heap ("OutOfMemoryError: Java heap space", then a build that
      # crawls for an hour). The runner has 16 GB, so give the daemon more here; GRADLE_USER_HOME overrides the project file.
      - name: Give the Gradle daemon more memory
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          # a stalled download fails after a minute and the retry loop below tries again
          systemProp.org.gradle.internal.http.connectionTimeout=60000
          systemProp.org.gradle.internal.http.socketTimeout=60000
          EOF
      # Format Test (round trips, real archives, codecs, script text) on the JVM; see app/src/test
      - name: Run Format Test
        run: |
          chmod +x ./gradlew
          # Maven Central sometimes answers "429 Too Many Requests" to the shared runners: try again a few times
          for i in 1 2 3; do ./gradlew testDebugUnitTest --stacktrace && exit 0; echo "Attempt $i failed"; sleep 45; done
          exit 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # AGP 4.2.2 needs JDK 11. The runner image already ships the Android SDK, so no separate SDK setup action is used
      # (the current sdkmanager needs JDK 17 and would fail under JDK 11).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      # (same as in unit-tests) gradle.properties keeps the small phone settings for AndroidIDE (-Xmx2048m, C1 JIT only). The Kotlin compiler runs
      # inside the Gradle daemon, and the app has grown past that heap ("OutOfMemoryError: Java heap space", then a build that
      # crawls for an hour). The runner has 16 GB, so give the daemon more here; GRADLE_USER_HOME overrides the project file.
      - name: Give the Gradle daemon more memory
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          # a stalled download fails after a minute and the retry loop below tries again
          systemProp.org.gradle.internal.http.connectionTimeout=60000
          systemProp.org.gradle.internal.http.socketTimeout=60000
          EOF

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          for i in 1 2 3; do ./gradlew assembleDebug --stacktrace && exit 0; echo "Attempt $i failed"; sleep 45; done
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: FuruArc-debug
          path: app/build/outputs/apk/debug/*.apk
