org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:TieredStopAtLevel=1 -XX:+UseSerialGC
android.useAndroidX=true
kotlin.code.style=official
org.gradle.vfs.watch=false
org.gradle.parallel=false
org.gradle.caching=false
kotlin.incremental=false
# Kotlin daemon (if it is still used): disable the C2 JIT, which crashes on Java 8 ARM
kotlin.daemon.jvm.options=-Xmx1024m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC
# Compile Kotlin inside the Gradle daemon (which already uses -XX:TieredStopAtLevel=1).
# Kotlin 1.6.10 reads this option as a system property, so it is written twice.
kotlin.compiler.execution.strategy=in-process
systemProp.kotlin.compiler.execution.strategy=in-process
