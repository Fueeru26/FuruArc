# Tuned for building on a phone (AndroidIDE / Termux). On a computer or CI raise the heap in ~/.gradle/gradle.properties
# (the GitHub workflow does). The Kotlin compiler runs inside the Gradle daemon, so this is also the compiler's heap: with 2 GB the
# build came close to "OutOfMemoryError" and spent most of its time in garbage collection, so 3 GB is much faster.
# If Android closes AndroidIDE during a build, go back to -Xmx2560m or -Xmx2048m.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:TieredStopAtLevel=1 -XX:+UseSerialGC
android.useAndroidX=true
kotlin.code.style=official
org.gradle.vfs.watch=false
org.gradle.parallel=false
org.gradle.caching=false
# Recompile only what changed: the full Kotlin compile is the longest step. If a build fails with a strange error after
# many files changed, run clean once (or set this to false).
kotlin.incremental=true
# Kotlin daemon (if it is still used): disable the C2 JIT, which crashes on Java 8 ARM
kotlin.daemon.jvm.options=-Xmx1024m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC
# Compile Kotlin inside the Gradle daemon (which already uses -XX:TieredStopAtLevel=1).
# Kotlin 1.6.10 reads this option as a system property, so it is written twice.
kotlin.compiler.execution.strategy=in-process
systemProp.kotlin.compiler.execution.strategy=in-process

# Build steps this app does not use (no BuildConfig, AIDL, RenderScript, shaders or resValue)
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.resvalues=false
